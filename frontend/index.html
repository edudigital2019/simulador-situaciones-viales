<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vía Segura · Simulador Vial y Consulta de Normativa (Ecuador)</title>
    <meta name="description" content="Plataforma educativa de situaciones reales de tránsito y consulta normativa del COIP y LOTTTSV en Ecuador." />
    <meta property="og:title" content="Vía Segura · Educación Vial (Ecuador)" />
    <meta property="og:description" content="Practica situaciones reales de tránsito y consulta multas según la ley." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2L2 7l10 5 10-5-10-5z'/><path d='M2 17l10 5 10-5'/><path d='M2 12l10 5 10-5'/></svg>" />
    <style>
      :root {
        color-scheme: light;
        --bg-canvas: #f8fafc;
        --bg-shell: rgba(241, 245, 249, 0.88);
        --bg-core: #ffffff;
        --bg-core-subtle: #f8fafc;
        --border-hairline: rgba(15, 23, 42, 0.08);
        --border-inner: rgba(15, 23, 42, 0.06);
        --inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.95);
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent-emerald: #059669;
        --accent-emerald-soft: #ecfdf5;
        --accent-amber: #d97706;
        --accent-amber-soft: #fffbeb;
        --accent-rose: #e11d48;
        --accent-rose-soft: #fff1f2;
        --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
        --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      ::selection {
        background: rgba(5, 150, 105, 0.16);
        color: #064e3b;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-canvas);
        background-image:
          radial-gradient(circle at 10% 6%, rgba(5, 150, 105, 0.06), transparent 38%),
          radial-gradient(circle at 90% 10%, rgba(217, 119, 6, 0.05), transparent 36%),
          radial-gradient(circle at 50% 96%, rgba(15, 23, 42, 0.03), transparent 45%);
        background-attachment: fixed;
        color: var(--text-primary);
        caret-color: var(--accent-emerald);
        line-height: 1.6;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      /* Subtle paper-grain overlay (GPU-safe, pointer-events-none) */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0.016;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Institutional GovTech Top Ribbon */
      .inst-ribbon {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(15, 23, 42, 0.07);
        padding: 0.45rem 1.5rem;
        font-size: 0.74rem;
        color: var(--text-secondary);
      }

      .inst-ribbon-inner {
        max-width: 1240px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      /* Double-Bezel (Doppelrand) Light Institutional Architecture */
      .bezel-shell {
        background: var(--bg-shell);
        border: 1px solid var(--border-hairline);
        padding: 6px;
        border-radius: 28px;
        box-shadow:
          0 20px 42px -14px rgba(15, 23, 42, 0.065),
          0 4px 12px -2px rgba(15, 23, 42, 0.035);
        transition: transform 0.55s var(--ease-spring), border-color 0.55s var(--ease-spring), box-shadow 0.55s var(--ease-spring);
      }

      .bezel-core {
        background: linear-gradient(180deg, #ffffff 0%, #fcfdfe 100%);
        border: 1px solid var(--border-inner);
        border-radius: 22px;
        box-shadow: var(--inner-highlight), 0 1px 3px rgba(15, 23, 42, 0.025);
        padding: 1.75rem;
      }

      /* Floating Frosted Island Nav */
      .island-nav {
        position: sticky;
        top: 1rem;
        z-index: 30;
        margin: 0 auto;
        width: fit-content;
        max-width: 100%;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(15, 23, 42, 0.09);
        box-shadow:
          0 14px 32px -8px rgba(15, 23, 42, 0.09),
          0 2px 6px rgba(15, 23, 42, 0.04),
          var(--inner-highlight);
        border-radius: 9999px;
        padding: 0.38rem;
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .island-tab {
        border: none;
        border-radius: 9999px;
        padding: 0.62rem 1.3rem;
        font-family: var(--font-sans);
        font-size: 0.86rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        transition: transform 0.45s var(--ease-spring), background-color 0.45s var(--ease-spring), color 0.45s var(--ease-spring), box-shadow 0.45s var(--ease-spring);
      }

      .island-tab:hover:not(.active) {
        background: #f1f5f9;
        color: #0f172a;
      }

      .island-tab:active {
        transform: scale(0.98);
      }

      .island-tab:focus-visible,
      .btn-island:focus-visible,
      .role-card:focus-visible,
      .diff-pill:focus-visible,
      .example-chip:focus-visible,
      .option-card:focus-visible,
      .tech-details summary:focus-visible {
        outline: 2px solid var(--accent-emerald);
        outline-offset: 2px;
      }

      /* Interactive Visual Role Selector Grid */
      .role-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(130px, 1fr));
        gap: 0.65rem;
      }

      .role-card {
        background: #ffffff;
        border: 1.5px solid #e2e8f0;
        border-radius: 16px;
        padding: 0.75rem 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.7rem;
        cursor: pointer;
        text-align: left;
        font-family: var(--font-sans);
        transition: transform 0.4s var(--ease-spring), border-color 0.4s var(--ease-spring), background-color 0.4s var(--ease-spring), box-shadow 0.4s var(--ease-spring);
      }

      .role-card:hover:not(:disabled) {
        transform: translateY(-2px);
        border-color: #94a3b8;
        box-shadow: 0 8px 18px -6px rgba(15, 23, 42, 0.07);
      }

      .role-card.active {
        background: #ecfdf5;
        border-color: #059669;
        box-shadow: 0 8px 20px -6px rgba(5, 150, 105, 0.18);
      }

      .role-icon-box {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: #f1f5f9;
        color: #475569;
        transition: background-color 0.35s var(--ease-spring), color 0.35s var(--ease-spring);
      }

      .role-card.active .role-icon-box {
        background: #059669;
        color: #ffffff;
      }

      /* Traffic-Light Difficulty Segmented Pills */
      .diff-pill-group {
        display: inline-flex;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 0.25rem;
        gap: 0.25rem;
        flex-wrap: wrap;
      }

      .diff-pill {
        border: 1px solid transparent;
        background: transparent;
        border-radius: 10px;
        padding: 0.5rem 0.9rem;
        font-family: var(--font-sans);
        font-size: 0.82rem;
        font-weight: 600;
        color: #475569;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        transition: all 0.35s var(--ease-spring);
      }

      .diff-pill:hover:not(:disabled):not(.active) {
        color: #0f172a;
        background: rgba(255, 255, 255, 0.6);
      }

      .diff-pill.active {
        background: #ffffff;
        color: #0f172a;
        border-color: #cbd5e1;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
      }

      /* Example Query Chips with Real Hover */
      .example-chip {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        color: #334155;
        border-radius: 9999px;
        padding: 0.48rem 0.95rem;
        font-family: var(--font-sans);
        font-size: 0.81rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
        transition: transform 0.35s var(--ease-spring), border-color 0.35s var(--ease-spring), background-color 0.35s var(--ease-spring), box-shadow 0.35s var(--ease-spring);
      }

      .example-chip:hover {
        transform: translateY(-1px);
        border-color: #94a3b8;
        background: #f8fafc;
        box-shadow: 0 4px 10px -3px rgba(15, 23, 42, 0.07);
      }

      .example-chip.active {
        background: #fffbeb;
        border-color: #f59e0b;
        color: #92400e;
        box-shadow: 0 4px 12px -3px rgba(245, 158, 11, 0.2);
      }

      /* Nested CTA Button-in-Button Architecture */
      .btn-island {
        border: none;
        border-radius: 9999px;
        padding: 0.55rem 0.65rem 0.55rem 1.4rem;
        font-family: var(--font-sans);
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: transform 0.5s var(--ease-spring), box-shadow 0.5s var(--ease-spring), opacity 0.3s var(--ease-spring);
      }

      .btn-island:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .btn-island:active:not(:disabled) {
        transform: scale(0.98);
      }

      .btn-island .btn-icon-wrap {
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.32);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.5s var(--ease-spring), background-color 0.5s var(--ease-spring);
      }

      .btn-island:hover:not(:disabled) .btn-icon-wrap {
        transform: translate(2px, -1px) scale(1.06);
        background: rgba(255, 255, 255, 0.32);
      }

      /* Tabular Numbers & Monospace Telemetry */
      .tabular-nums {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      /* Form Controls */
      .control-input {
        background: #ffffff;
        color: var(--text-primary);
        border: 1px solid #cbd5e1;
        border-radius: 14px;
        padding: 0.68rem 1rem;
        font-family: var(--font-sans);
        font-size: 0.92rem;
        font-weight: 500;
        outline: none;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        transition: border-color 0.35s var(--ease-spring), box-shadow 0.35s var(--ease-spring);
      }

      .control-input::placeholder {
        color: #64748b;
      }

      .control-input:focus {
        border-color: var(--accent-emerald);
        box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15), 0 1px 2px rgba(15, 23, 42, 0.04);
      }

      /* Interactive Option Card */
      .option-card {
        width: 100%;
        text-align: left;
        border-radius: 18px;
        padding: 1.1rem 1.3rem;
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        font-family: var(--font-sans);
        font-size: 0.98rem;
        color: var(--text-primary);
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
        transition: transform 0.45s var(--ease-spring), border-color 0.45s var(--ease-spring), background-color 0.45s var(--ease-spring), box-shadow 0.45s var(--ease-spring);
      }

      .option-card:hover:not(:disabled) {
        transform: translateY(-2px);
        border-color: #94a3b8 !important;
        box-shadow: 0 10px 22px -8px rgba(15, 23, 42, 0.09);
      }

      .option-card:active:not(:disabled) {
        transform: scale(0.99);
      }

      /* Entry Reveal & Skeleton Shimmer */
      @keyframes fadeUpReveal {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .reveal-up {
        animation: fadeUpReveal 0.65s var(--ease-spring) both;
      }

      @keyframes pulseOpacity {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.95; }
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .spin-animate {
        animation: spin 0.85s linear infinite;
      }

      @keyframes shimmerSweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(240%); }
      }

      .shimmer-active {
        position: relative;
        overflow: hidden;
      }

      .shimmer-active::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(5, 150, 105, 0.16) 50%, transparent 100%);
        animation: shimmerSweep 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .skeleton-bar {
        background: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 50%, #f1f5f9 100%);
        border-radius: 10px;
        animation: pulseOpacity 1.6s var(--ease-spring) infinite;
      }

      /* Bento Responsive Grid */
      .bento-hero-grid {
        display: grid;
        grid-template-columns: 1.55fr 1fr;
        gap: 1.25rem;
        align-items: stretch;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
      }

      /* Collapsible Technical Details */
      .tech-details {
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        border-radius: 16px;
        overflow: hidden;
      }

      .tech-details summary {
        list-style: none;
        cursor: pointer;
        padding: 0.85rem 1.15rem;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: space-between;
        user-select: none;
        transition: color 0.3s var(--ease-spring), background-color 0.3s var(--ease-spring);
      }

      .tech-details summary::-webkit-details-marker {
        display: none;
      }

      .tech-details summary:hover {
        color: var(--text-primary);
        background: #f1f5f9;
      }

      .tech-details-body {
        border-top: 1px solid #e2e8f0;
        padding: 1.15rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        background: #ffffff;
      }

      @media (max-width: 1024px) {
        .role-grid {
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        }
      }

      @media (max-width: 860px) {
        .bento-hero-grid {
          grid-template-columns: 1fr;
        }
        .bezel-core {
          padding: 1.25rem;
        }
        .island-nav {
          border-radius: 22px;
        }
      }

      @media (max-width: 520px) {
        .kpi-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
