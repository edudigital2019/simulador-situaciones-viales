name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: us-central1
  SERVICIO: g8-vial

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      LLM_PRINCIPAL: simulado
      LLM_RESPALDO: ""

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Revisar secretos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias del backend
        run: pip install -r requirements.txt

      - name: Preparar modelo de embeddings
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('intfloat/multilingual-e5-small')"

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Evaluar el RAG
        run: python eval/run_eval.py

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

  despliegue:
    runs-on: ubuntu-latest
    needs: pruebas
    if: vars.HABILITAR_DESPLIEGUE == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch')

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Desplegar en Cloud Run
        id: despliegue
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICIO }}
          region: ${{ env.REGION }}
          source: .
          flags: --allow-unauthenticated

      - name: Ejecutar pruebas de humo
        run: |
          URL="${{ steps.despliegue.outputs.url }}"
          python tests/smoke.py "$URL"
